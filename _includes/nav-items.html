<div class="nav-items">
  {% for path in include.paths %}
    {% assign nav_page = site.pages | where: "path", path | first %}
    {% if nav_page.title %}
    <a class="nav-item" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
    {% endif %}
  {% endfor %}
</div>
